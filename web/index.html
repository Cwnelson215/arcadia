<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>arcadia — Stage 1</title>
  <style>
    body { margin: 0; background: #111; color: #eee;
           font: 14px system-ui, -apple-system, sans-serif; }
    #wrap { display: flex; flex-direction: column; align-items: center;
            gap: 12px; padding: 16px; }
    h2 { margin: 4px 0; font-weight: 600; }
    video { background: #000; width: min(1600px, 95vw); max-width: 100%;
            aspect-ratio: 16 / 9; display: block; }
    /* Fullscreen a wrapper, NOT the <video> — fullscreening the video itself makes
       the browser overlay native media controls (a pause button + a running timer
       in the corner). */
    #stage:fullscreen { display: flex; align-items: center; justify-content: center;
                        background: #000; width: 100%; height: 100%; }
    #stage:fullscreen video { width: 100%; height: 100%; aspect-ratio: auto;
                              object-fit: contain; }
    #bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
           justify-content: center; }
    button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
    button:disabled { cursor: default; opacity: 0.5; }
    #hint { color: #9aa; font-size: 13px; }
    #hint.locked { color: #3c3; }
    #games { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
             max-width: 1280px; }
    #games button.game.running { outline: 2px solid #3c3; }
    #stats { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
             white-space: pre; background: #1b1b1b; padding: 10px 14px;
             border-radius: 6px; min-width: 320px; }
    /* Overlay menu — all controls live here, summoned on demand (double-tap Esc
       on desktop, long-press on touch) so the default view is just the stream. */
    #menuBackdrop { position: fixed; inset: 0; z-index: 50;
                    background: rgba(0, 0, 0, 0.45);
                    display: flex; align-items: center; justify-content: center; }
    #menuBackdrop.hidden { display: none; }
    #menu { background: rgba(20, 20, 20, 0.82); backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px); border: 1px solid #333;
            border-radius: 10px; padding: 18px; display: flex;
            flex-direction: column; align-items: center; gap: 14px;
            max-width: 95vw; max-height: 92vh; overflow: auto;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6); }
    #menuHead { display: flex; align-items: center; gap: 12px; width: 100%;
                justify-content: space-between; }
    #menuHead h2 { margin: 0; }
    #close { padding: 4px 12px; }
    /* Faint always-visible affordance to open the menu (the "transparent button"). */
    #menuToggle { position: fixed; top: 12px; right: 12px; z-index: 40;
                  opacity: 0.32; background: rgba(20, 20, 20, 0.6); color: #eee;
                  border: 1px solid #555; border-radius: 8px; padding: 6px 12px;
                  font-size: 18px; line-height: 1; transition: opacity 0.15s; }
    #menuToggle:hover { opacity: 0.9; }
    .dot { display: inline-block; width: 10px; height: 10px;
           border-radius: 50%; background: #888; }
    .dot.on { background: #3c3; }
    .dot.err { background: #c33; }
    #touchToggle.on { outline: 2px solid #3c3; }
    /* Mobile: let the stream fill the screen and grow when the phone is rotated
       to landscape. The video is centered + letterboxed; controls overlay it. */
    body.mobile #wrap { padding: 0; gap: 0; }
    body.mobile #hint { display: none; }
    body.mobile #stage { position: fixed; inset: 0; z-index: 1; background: #000;
                         display: flex; align-items: center; justify-content: center; }
    body.mobile #stage video { width: 100vw; width: 100dvw; height: 100vh;
                               height: 100dvh; max-width: none; aspect-ratio: auto;
                               object-fit: contain; }
    /* On-screen touch controls — a translucent virtual gamepad for mobile. The
       container is pointer-events:none so taps on bare video pass through; only
       .tbtn controls are interactive. Clusters are anchored to the screen edges
       (laid out for landscape) so they never overlap. --sz scales the round
       buttons with the viewport but caps so they stay touch-sized, not huge. */
    #touchpad { position: fixed; inset: 0; z-index: 30; pointer-events: none;
                touch-action: none; --sz: clamp(42px, 11vmin, 58px); }
    #touchpad.hidden { display: none; }
    .tbtn { pointer-events: auto; touch-action: none; user-select: none;
            -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
            display: flex; align-items: center; justify-content: center;
            background: rgba(20, 20, 20, 0.55); color: #eee; border: 1px solid #666;
            opacity: 0.45; font-weight: 600;
            transition: opacity 0.08s, background 0.08s; }
    .tbtn.pressed, .tbtn:active { opacity: 0.95; background: rgba(60, 120, 60, 0.75); }
    .tbtn.round { width: var(--sz); height: var(--sz); border-radius: 50%;
                  font-size: calc(var(--sz) * 0.42); }
    .tbtn.pill { border-radius: 999px; padding: 8px 12px;
                 font-size: clamp(11px, 3.2vmin, 15px); }
    /* Edge-anchored clusters. Top row: shoulders (corners) + sys (center).
       Bottom row: D-pad (left) + keys (center) + face (right). env(safe-area-*)
       keeps them clear of notches/rounded corners. */
    .tp-cluster { position: fixed; pointer-events: none; display: flex; gap: 6px; }
    .tp-shoulders-l { top: calc(8px + env(safe-area-inset-top));
                      left: calc(8px + env(safe-area-inset-left)); }
    .tp-shoulders-r { top: calc(8px + env(safe-area-inset-top));
                      right: calc(8px + env(safe-area-inset-right)); }
    .tp-sys { top: calc(8px + env(safe-area-inset-top)); left: 50%;
              transform: translateX(-50%); }
    .tp-dpad { bottom: calc(8px + env(safe-area-inset-bottom));
               left: calc(8px + env(safe-area-inset-left)); display: grid;
               grid-template-columns: repeat(3, var(--sz));
               grid-template-rows: repeat(3, var(--sz)); gap: 2px; }
    .tp-dpad .up    { grid-area: 1 / 2; } .tp-dpad .left  { grid-area: 2 / 1; }
    .tp-dpad .right { grid-area: 2 / 3; } .tp-dpad .down  { grid-area: 3 / 2; }
    .tp-face { bottom: calc(8px + env(safe-area-inset-bottom));
               right: calc(8px + env(safe-area-inset-right)); display: grid;
               grid-template-columns: repeat(3, var(--sz));
               grid-template-rows: repeat(3, var(--sz)); gap: 2px; }
    .tp-face .y { grid-area: 1 / 2; } .tp-face .x { grid-area: 2 / 1; }
    .tp-face .b { grid-area: 2 / 3; } .tp-face .a { grid-area: 3 / 2; }
    .tp-keys { bottom: calc(8px + env(safe-area-inset-bottom)); left: 50%;
               transform: translateX(-50%); flex-wrap: wrap;
               justify-content: center; max-width: 56vw; }
  </style>
</head>
<body>
  <button id="menuToggle" title="Menu (double-tap Esc or long-press)">☰</button>
  <div id="wrap">
    <div id="stage">
      <video id="video" autoplay playsinline muted disablepictureinpicture></video>
      <!-- On-screen touch controls (mobile). A translucent virtual gamepad laid
           out for landscape: shoulders top-corners, Select/Guide/Start top-center,
           D-pad bottom-left, A/B/X/Y bottom-right, keyboard strip bottom-center.
           data-gp = W3C gamepad button index ({t:"g"}); data-key =
           KeyboardEvent.code ({t:"k"}). Lives inside #stage so it overlays the
           video in normal and fullscreen. Wired in main.js. -->
      <div id="touchpad" class="hidden">
        <div class="tp-cluster tp-shoulders-l">
          <button class="tbtn pill" data-gp="4">L1</button>
          <button class="tbtn pill" data-gp="6">L2</button>
        </div>
        <div class="tp-cluster tp-shoulders-r">
          <button class="tbtn pill" data-gp="7">R2</button>
          <button class="tbtn pill" data-gp="5">R1</button>
        </div>
        <div class="tp-cluster tp-sys">
          <button class="tbtn pill" data-gp="8">Select</button>
          <button class="tbtn pill" data-gp="16">Guide</button>
          <button class="tbtn pill" data-gp="9">Start</button>
        </div>
        <div class="tp-cluster tp-dpad">
          <button class="tbtn round up"    data-gp="12">▲</button>
          <button class="tbtn round left"  data-gp="14">◀</button>
          <button class="tbtn round right" data-gp="15">▶</button>
          <button class="tbtn round down"  data-gp="13">▼</button>
        </div>
        <div class="tp-cluster tp-face">
          <button class="tbtn round y" data-gp="3">Y</button>
          <button class="tbtn round x" data-gp="2">X</button>
          <button class="tbtn round b" data-gp="1">B</button>
          <button class="tbtn round a" data-gp="0">A</button>
        </div>
        <div class="tp-cluster tp-keys">
          <button class="tbtn pill" data-key="Escape">Esc</button>
          <button class="tbtn pill" data-key="Enter">Enter</button>
          <button class="tbtn pill" data-key="Backspace">Bksp</button>
          <button class="tbtn pill" id="dropPadTouch" title="Drop the virtual controller (back to keyboard)">⎋Ctrl</button>
        </div>
      </div>
    </div>
    <div id="hint">click the video to capture · double-tap Esc or long-press for the menu</div>
  </div>
  <div id="menuBackdrop" class="hidden">
    <div id="menu">
      <div id="menuHead">
        <h2>arcadia</h2>
        <button id="close" title="Close menu">✕</button>
      </div>
      <div id="bar">
        <button id="connect">Connect</button>
        <button id="stop">Stop game</button>
        <button id="fullscreen">Fullscreen</button>
        <button id="esc" title="Send Esc to the game — Back in Steam Big Picture (the browser eats the real Esc key to release the mouse, so it never reaches the game)">Back (Esc)</button>
        <button id="touchToggle" title="Show/hide the on-screen touch controls (virtual gamepad + keyboard). Auto-on for touch devices.">Touch controls</button>
        <button id="dropPad" title="Destroy the virtual controller so Steam Big Picture leaves controller mode and the keyboard works again. The touch pad re-creates it on the next press.">Exit controller mode</button>
        <span class="dot" id="state"></span>
        <span id="statetext">idle</span>
      </div>
      <div id="games">loading games…</div>
      <div id="stats">no stats yet — click Connect</div>
    </div>
  </div>
  <script src="main.js?v=9"></script>
</body>
</html>
