[package]
name = "arcadia"
version = "0.1.0"
edition = "2021"
description = "Self-hosted Stadia-style cloud gaming — Stage 1: one-way video (capture → VA-API H.264 → WebRTC → browser)"

[dependencies]
gstreamer = "0.23"
gstreamer-webrtc = { version = "0.23", features = ["v1_22"] }
gstreamer-sdp = "0.23"
glib = "0.20"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
evdev = "0.12"
libc = "0.2"

[dev-dependencies]
# Temp games.toml fixtures for launcher + signaling tests.
tempfile = "3"
# `oneshot` for the in-process /api/games handler test (tower-http is already a
# runtime dep; this adds the ServiceExt test util). http-body-util collects the
# response body. Both versions already resolved transitively in Cargo.lock.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
